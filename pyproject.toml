[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-ticket-validator"
version = "0.1.0"
description = "Prototype for signed ticket validation and duplicate check-in prevention."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1,<4"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ridwan Aguda" }
]
keywords = ["event-tech", "ticketing", "qr", "check-in", "hmac"]

[project.optional-dependencies]
identity = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
qr-ticket-validator = "qr_ticket_validator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
